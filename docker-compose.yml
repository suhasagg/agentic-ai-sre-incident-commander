services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sre
      POSTGRES_PASSWORD: sre
      POSTGRES_DB: sre
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  java-sre:
    build: ./java-sre
    ports: ["8081:8081"]

  python-commander:
    build: ./python-commander
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sre:sre@postgres:5432/sre
      REDIS_URL: redis://redis:6379/0
      SRE_MCP_URL: http://java-sre:8081/mcp
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      java-sre:
        condition: service_started
